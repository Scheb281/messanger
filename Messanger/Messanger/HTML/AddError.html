<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrix Error | Пользователь не найден</title>
    <style>
        /* Глобальный сброс и матричный фон */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #020a02, #000100);
            font-family: 'Courier New', 'Fira Code', 'Cascadia Code', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

            /* Эффект сканирующих строк (как в старом ЭЛТ-мониторе) */
            body::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.02) 0px, rgba(0, 255, 0, 0.02) 2px, transparent 2px, transparent 6px);
                pointer-events: none;
                z-index: 1;
                animation: scanlines 8s linear infinite;
            }

        @keyframes scanlines {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 30px;
            }
        }

        /* Затемнение по краям для фокуса на сообщении */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            z-index: 1;
        }

        /* Карточка ошибки — как терминал с красным предупреждением */
        .error-terminal {
            background: rgba(5, 12, 5, 0.92);
            backdrop-filter: blur(4px);
            border: 2px solid #ff3366;
            border-radius: 28px;
            padding: 2.5rem 2rem;
            width: 90%;
            max-width: 540px;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.4), inset 0 0 15px rgba(255, 51, 102, 0.2);
            transition: all 0.25s ease;
            z-index: 10;
            position: relative;
            animation: glitchFlash 0.5s ease-out;
        }

        @keyframes glitchFlash {
            0% {
                opacity: 0;
                transform: scale(0.96);
                filter: blur(2px);
            }

            20% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0px);
            }

            100% {
                opacity: 1;
            }
        }

        /* Заголовок ошибки с красным неоном */
        .error-title {
            text-align: center;
            margin-bottom: 1.8rem;
        }

            .error-title h1 {
                color: #ff2e5e;
                font-size: 2.2rem;
                letter-spacing: 4px;
                text-transform: uppercase;
                font-weight: 700;
                text-shadow: 0 0 10px #ff1144, 0 0 20px #ff0040;
                background: rgba(0, 0, 0, 0.4);
                display: inline-block;
                padding: 0 0.8rem 0.5rem;
                border-bottom: 3px solid #ff3366;
                font-family: 'Courier New', monospace;
            }

        /* Иконка ошибки ASCII-стиль */
        .error-icon {
            text-align: center;
            font-size: 4rem;
            margin: 1rem 0 0.5rem;
            filter: drop-shadow(0 0 8px #ff3366);
            animation: errorPulse 1.5s infinite;
        }

        @keyframes errorPulse {
            0% {
                opacity: 0.6;
                text-shadow: 0 0 0px #ff3366;
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 12px #ff5c7c;
                transform: scale(1.02);
            }

            100% {
                opacity: 0.6;
                text-shadow: 0 0 0px #ff3366;
            }
        }

        /* Сообщение об ошибке с кодом */
        .error-message {
            background: #0a100a;
            border-left: 6px solid #ff2e5e;
            padding: 1.2rem 1rem;
            margin: 1.8rem 0;
            font-family: monospace;
            color: #ffb3c1;
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 2px 8px rgba(255,0,50,0.2);
        }

        .error-code {
            font-size: 0.85rem;
            color: #ff7799;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px dashed #a0334d;
            padding-bottom: 8px;
        }

        .error-detail {
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffc0d0;
            word-break: break-word;
            line-height: 1.4;
        }

            .error-detail span {
                color: #ff607f;
                background: #1c0510;
                padding: 3px 8px;
                border-radius: 20px;
                font-family: monospace;
            }

        /* Кнопка в стиле матрицы, но с тревожным акцентом */
        .btn-matrix {
            background: rgba(10, 20, 10, 0.9);
            border: 1.5px solid #ff5a7a;
            padding: 14px 24px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.15rem;
            letter-spacing: 2px;
            color: #ffb0c0;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s;
            width: 100%;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

            .btn-matrix:hover {
                background: #2a1520;
                border-color: #ff3366;
                box-shadow: 0 0 18px #ff3366;
                color: #ffffff;
                text-shadow: 0 0 5px #ff3366;
                transform: scale(1.01);
            }

        /* Нижняя строка с системной информацией */
        .system-footer {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.7rem;
            color: #4c9e6a;
            border-top: 1px solid #226633;
            padding-top: 1.2rem;
        }

        .sys-blink {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0c1a0c;
            padding: 5px 12px;
            border-radius: 40px;
        }

        .red-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ff3366;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff2e5e;
            animation: redPulse 0.8s infinite;
        }

        @keyframes redPulse {
            0% {
                opacity: 0.4;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .green-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #33ff77;
            border-radius: 50%;
            box-shadow: 0 0 6px #2eff6e;
            animation: pulseGreen 1.2s infinite;
        }

        @keyframes pulseGreen {
            0% {
                opacity: 0.5;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        /* Эффект глитча для текста (мелкий баг) */
        @keyframes textGlitch {
            0% {
                text-shadow: -1px 0 #ff3366, 1px 0 #33ff77;
            }

            50% {
                text-shadow: 1px 0 #ff3366, -1px 0 #33ff77;
            }

            100% {
                text-shadow: -1px 0 #ff3366, 1px 0 #33ff77;
            }
        }

        .glitch {
            animation: textGlitch 0.3s infinite;
        }

        /* Адаптивность */
        @media (max-width: 550px) {
            .error-terminal {
                padding: 1.5rem;
            }

            .error-title h1 {
                font-size: 1.5rem;
                letter-spacing: 2px;
            }

            .error-icon {
                font-size: 2.8rem;
            }

            .error-detail {
                font-size: 0.9rem;
            }

            .btn-matrix {
                font-size: 0.9rem;
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="error-terminal">
        <div class="error-title">
            <h1>⚠ ERROR 404 ⚠</h1>
        </div>

        <div class="error-icon">
            [✖] [✖] [✖]
        </div>

        <div class="error-message">
            <div class="error-code">
                <span class="red-dot"></span> STATUS: <span style="color:#ff5370;">USER_NOT_FOUND</span>
                <span style="margin-left:auto;">CODE: 0x7E4</span>
            </div>
            <div class="error-detail">
                ❌ <span>«Пользователь не найден»</span> ❌<br>
                -> Запись в матрице отсутствует<br>
                -> Проверьте введённый ник или <span style="color:#ff8aa5;">синхронизацию</span>
            </div>
        </div>

        <!-- Форма возврата на добавление контакта -->
        <form method="get" action="/AddContact">
            <button type="submit" class="btn-matrix">
                <span>⟳</span> ВЕРНУТЬСЯ / REPAIR <span>⟳</span>
            </button>
        </form>

        <div class="system-footer">
            <div class="sys-blink">
                <span class="green-dot"></span> MATRIX_NODE: ONLINE
            </div>
            <div class="sys-blink">
                <span class="red-dot"></span> ERROR_LOG: ACTIVE
            </div>
            <div class="sys-blink">
                ⌨️ RETRY_LIMIT: 3
            </div>
        </div>
    </div>
</body>
</html>
