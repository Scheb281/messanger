<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Матрица | Доступ разрешён</title>
    <style>
        /* ---------- МАТРИЦА: СТИЛЬ БЕЗ JS, ЧИСТЫЙ CSS ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 40%, #031003, #000300);
            font-family: 'Courier New', 'Fira Code', 'Source Code Pro', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

            /* ---------- МАТРИЧНЫЙ ФОН (статический "код" + анимированный дождь из псевдоэлементов) ---------- */
            body::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: repeating-linear-gradient(0deg, rgba(0, 30, 0, 0.3) 0px, rgba(0, 60, 0, 0.3) 2px, transparent 2px, transparent 8px), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" opacity="0.12"><text x="10" y="20" fill="%2333ff33" font-size="9" font-family="monospace">01101101</text><text x="80" y="45" fill="%2322ee44" font-size="8">01100001</text><text x="140" y="70" fill="%2333ff66" font-size="10">01110100</text><text x="30" y="85" fill="%2322ff55" font-size="8">01110010</text><text x="120" y="15" fill="%2333dd55" font-size="9">01101001</text><text x="170" y="95" fill="%2322cc44" font-size="8">01111000</text></svg>');
                background-repeat: repeat;
                background-size: 80px 80px, 150px 100px;
                pointer-events: none;
                z-index: 0;
                animation: matrixBgScroll 28s linear infinite;
            }

        @keyframes matrixBgScroll {
            0% {
                background-position: 0 0, 0 0;
            }

            100% {
                background-position: 120px 120px, 80px 150px;
            }
        }

        /* Эффект падающих символов (чистый CSS, капли движутся) — используем множество теней */
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

            /* Создаём иллюзию "цифрового дождя" с помощью псевдоэлементов и теней (без JS) */
            .matrix-rain::before {
                content: "01 10 01 11 00 10 01 10 11 00 01 10 01 01 10 11 00 10 01 10 01 00 11 01 10 01 10 11 00 10 01 10 11 01 00 10 01 10 01 11 00";
                position: absolute;
                top: -20%;
                left: 5%;
                font-family: monospace;
                font-size: 18px;
                font-weight: bold;
                white-space: nowrap;
                color: rgba(60, 255, 80, 0.18);
                text-shadow: 0 0 5px #2eff6e;
                animation: rainDrop1 12s linear infinite;
                width: 100%;
                letter-spacing: 25px;
            }

            .matrix-rain::after {
                content: "1100 0110 1010 1001 0011 1101 0110 1011 0010 1110 0101 1001 0110 1101 1010 0111 1000 0110 0101";
                position: absolute;
                top: -30%;
                left: 45%;
                font-family: monospace;
                font-size: 22px;
                white-space: nowrap;
                color: rgba(50, 220, 70, 0.16);
                text-shadow: 0 0 4px #2eff6e;
                animation: rainDrop2 15s linear infinite;
                letter-spacing: 35px;
            }

        @keyframes rainDrop1 {
            0% {
                transform: translateY(-20%) translateX(0px);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.4;
            }

            100% {
                transform: translateY(120vh) translateX(30px);
                opacity: 0;
            }
        }

        @keyframes rainDrop2 {
            0% {
                transform: translateY(-40%) translateX(0px);
                opacity: 0;
            }

            15% {
                opacity: 0.5;
            }

            85% {
                opacity: 0.4;
            }

            100% {
                transform: translateY(130vh) translateX(-40px);
                opacity: 0;
            }
        }

        /* Добавим дополнительные колонки с символами через несколько слоёв */
        .rain-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

            .rain-layer div {
                position: absolute;
                font-family: monospace;
                font-weight: bold;
                white-space: pre;
                color: rgba(70, 255, 100, 0.2);
                animation: columnFall linear infinite;
            }

        /* Каждая колонка со случайной задержкой и скоростью */
        .col1 {
            left: 8%;
            font-size: 20px;
            animation-duration: 9s;
            animation-delay: 0s;
            content: "01011010";
        }

        .col2 {
            left: 18%;
            font-size: 18px;
            animation-duration: 13s;
            animation-delay: 2s;
        }

        .col3 {
            left: 28%;
            font-size: 24px;
            animation-duration: 11s;
            animation-delay: 4s;
        }

        .col4 {
            left: 38%;
            font-size: 16px;
            animation-duration: 14s;
            animation-delay: 1s;
        }

        .col5 {
            left: 48%;
            font-size: 22px;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        .col6 {
            left: 58%;
            font-size: 19px;
            animation-duration: 12s;
            animation-delay: 5s;
        }

        .col7 {
            left: 68%;
            font-size: 21px;
            animation-duration: 8s;
            animation-delay: 2.5s;
        }

        .col8 {
            left: 78%;
            font-size: 17px;
            animation-duration: 15s;
            animation-delay: 0.5s;
        }

        .col9 {
            left: 88%;
            font-size: 23px;
            animation-duration: 11.5s;
            animation-delay: 3.2s;
        }

        .col10 {
            left: 96%;
            font-size: 20px;
            animation-duration: 9.8s;
            animation-delay: 1.8s;
        }

        @keyframes columnFall {
            0% {
                top: -10%;
                opacity: 0;
                transform: rotate(0deg);
            }

            10% {
                opacity: 0.5;
            }

            90% {
                opacity: 0.4;
            }

            100% {
                top: 110%;
                opacity: 0;
                transform: rotate(2deg);
            }
        }

        /* Основной контейнер приветствия — стиль терминала */
        .welcome-container {
            position: relative;
            z-index: 20;
            background: rgba(0, 8, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 2px solid #3eff7a;
            border-radius: 48px;
            padding: 3rem 2.5rem;
            width: 90%;
            max-width: 580px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.4), inset 0 0 18px rgba(80, 255, 100, 0.2);
            transition: all 0.3s ease;
            animation: borderPulse 3s infinite alternate;
        }

        @keyframes borderPulse {
            0% {
                border-color: #2eff7a;
                box-shadow: 0 0 25px rgba(0, 255, 100, 0.3);
            }

            100% {
                border-color: #aaffaa;
                box-shadow: 0 0 55px rgba(70, 255, 100, 0.7), inset 0 0 12px #6eff9e;
            }
        }

        /* Стиль заголовка — эффект глитча (только CSS) */
        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #b3ffb3;
            text-shadow: 0 0 8px #00ff66, 0 0 3px #3eff6e;
            letter-spacing: 5px;
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
            animation: glitchPulse 1.8s infinite alternate;
        }

            /* Эффект "двойного изображения" для глитча */
            h1::before,
            h1::after {
                content: "С ВОЗВРАЩЕНИЕМ!";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                opacity: 0.5;
                pointer-events: none;
            }

            h1::before {
                color: #ff44aa;
                z-index: -1;
                text-shadow: 2px 0 #ff2266;
                transform: translate(-1.5px, 0);
                clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
                animation: glitchShift1 2.2s infinite steps(1);
            }

            h1::after {
                color: #44ffaa;
                z-index: -2;
                text-shadow: -2px 0 #22ff88;
                transform: translate(1.5px, 0);
                clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
                animation: glitchShift2 2.5s infinite steps(1);
            }

        @keyframes glitchShift1 {
            0%, 100% {
                transform: translate(-1.2px, 0);
                opacity: 0.4;
            }

            20% {
                transform: translate(1px, 0.5px);
                opacity: 0.7;
            }

            40% {
                transform: translate(-2px, -0.3px);
                opacity: 0.3;
            }

            60% {
                transform: translate(1.8px, 0.2px);
                opacity: 0.8;
            }

            80% {
                transform: translate(-0.5px, -0.2px);
                opacity: 0.5;
            }
        }

        @keyframes glitchShift2 {
            0%, 100% {
                transform: translate(1px, 0);
                opacity: 0.5;
            }

            25% {
                transform: translate(-1.2px, -0.4px);
                opacity: 0.7;
            }

            50% {
                transform: translate(2px, 0.3px);
                opacity: 0.4;
            }

            75% {
                transform: translate(-1px, 0.1px);
                opacity: 0.8;
            }
        }

        /* Кнопка "К чатам" — матричный терминальный стиль */
        .matrix-btn {
            background: transparent;
            border: 2px solid #33ff77;
            color: #d0ffd0;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.4rem;
            padding: 14px 36px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            letter-spacing: 4px;
            text-transform: uppercase;
            box-shadow: 0 0 12px rgba(60, 255, 80, 0.5);
            background: rgba(20, 60, 20, 0.3);
            width: 100%;
            max-width: 280px;
            margin-top: 20px;
        }

            .matrix-btn:hover {
                background: #2eff5e33;
                border-color: #ccffcc;
                color: #ffffff;
                text-shadow: 0 0 8px #0f0;
                box-shadow: 0 0 28px #3eff7e;
                transform: scale(1.03);
                letter-spacing: 5px;
            }

            .matrix-btn:active {
                transform: scale(0.98);
            }

        /* Дополнительный декоративный элемент — "сканирующая линия" */
        .scan-line {
            position: fixed;
            top: -5%;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #2eff7a, #aaffaa, #2eff7a, transparent);
            box-shadow: 0 0 20px #3eff6e;
            z-index: 30;
            animation: scanMove 6s ease-in-out infinite;
            pointer-events: none;
            opacity: 0.6;
        }

        @keyframes scanMove {
            0% {
                top: -5%;
                opacity: 0.3;
            }

            50% {
                top: 95%;
                opacity: 1;
            }

            100% {
                top: -5%;
                opacity: 0.3;
            }
        }

        /* Красивый статус-бар внизу (без JS, просто стиль) */
        .status-bar {
            position: fixed;
            bottom: 18px;
            left: 20px;
            font-size: 11px;
            background: rgba(0, 15, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 6px 14px;
            border-radius: 30px;
            font-family: monospace;
            color: #70ff90;
            border-left: 3px solid #2eff7a;
            letter-spacing: 1.5px;
            z-index: 25;
            animation: softPulse 2s infinite alternate;
        }

        @keyframes softPulse {
            0% {
                opacity: 0.5;
                text-shadow: none;
                border-left-color: #3eff6e;
            }

            100% {
                opacity: 1;
                text-shadow: 0 0 3px #2eff5e;
                border-left-color: #aaffaa;
            }
        }

        /* Вторая декоративная линия (эффект монитора) */
        .crt-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.02) 0px, rgba(0, 0, 0, 0.05) 1px, transparent 2px, transparent 6px);
            pointer-events: none;
            z-index: 35;
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 620px) {
            .welcome-container {
                padding: 2rem 1.5rem;
                max-width: 90%;
            }

            h1 {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }

            .matrix-btn {
                font-size: 1.1rem;
                padding: 12px 20px;
                max-width: 220px;
                letter-spacing: 2px;
            }

            .status-bar {
                font-size: 8px;
                bottom: 12px;
                left: 12px;
            }

            .col1, .col2, .col3, .col4, .col5, .col6, .col7, .col8, .col9, .col10 {
                font-size: 14px !important;
            }
        }

        /* Дополнительные детали: эффект свечения для контейнера */
        .welcome-container::after {
            content: ">";
            position: absolute;
            bottom: 18px;
            right: 28px;
            font-size: 20px;
            color: #4eff7e;
            opacity: 0.6;
            font-weight: bold;
            animation: blinkCursor 1.2s step-end infinite;
        }

        @keyframes blinkCursor {
            0%, 100% {
                opacity: 0.6;
            }

            50% {
                opacity: 0;
            }
        }

        /* Легкий эффект шума (зернистость) */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" opacity="0.03"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="1" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)"/></svg>');
            pointer-events: none;
            z-index: 40;
            opacity: 0.2;
        }

        /* Анимация для дополнительных символов в колонках */
        .rain-layer div::before {
            content: "01 10 11 00 10 01 10";
            white-space: pre;
            animation: changeContent 4s infinite alternate;
        }

        /* Для каждой колонки разные наборы символов (ручная настройка) */
        .col1::before {
            content: "1010 0110 1100 0011";
            animation: none;
            display: block;
        }

        .col2::before {
            content: "1101 0010 1011 0111";
            animation: none;
        }

        .col3::before {
            content: "0110 1001 1110 0100";
            animation: none;
        }

        .col4::before {
            content: "1001 1100 0010 1101";
            animation: none;
        }

        .col5::before {
            content: "0101 1010 0110 1001";
            animation: none;
        }

        .col6::before {
            content: "1110 0001 1011 0101";
            animation: none;
        }

        .col7::before {
            content: "0011 1100 1001 0110";
            animation: none;
        }

        .col8::before {
            content: "0111 1000 0101 1011";
            animation: none;
        }

        .col9::before {
            content: "1011 0100 1110 0001";
            animation: none;
        }

        .col10::before {
            content: "1100 0011 0101 1010";
            animation: none;
        }
    </style>
</head>
<body>

    <!-- Матричный дождь из псевдоэлементов (без JS) -->
    <div class="matrix-rain"></div>
    <div class="rain-layer">
        <div class="col1"></div>
        <div class="col2"></div>
        <div class="col3"></div>
        <div class="col4"></div>
        <div class="col5"></div>
        <div class="col6"></div>
        <div class="col7"></div>
        <div class="col8"></div>
        <div class="col9"></div>
        <div class="col10"></div>
    </div>

    <div class="scan-line"></div>
    <div class="crt-effect"></div>
    <div class="noise-overlay"></div>

    <div class="status-bar">
        [ СИСТЕМА: ДОСТУП РАЗРЕШЁН ] :: ПОЛЬЗОВАТЕЛЬ В СЕТИ
    </div>

    <div class="welcome-container">
        <h1>С возвращением!</h1>
        <form method="GET" action="/chats">
            <button type="submit" class="matrix-btn">⟣ К ЧАТАМ ⟢</button>
        </form>
    </div>

</body>
</html>
