<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serlen Messenger | Главное меню</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f0a, #030603);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Fira Code', 'Courier New', monospace;
            position: relative;
            overflow-x: hidden;
        }

            /* Эффект "матричных" линий на фоне */
            body::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.03) 0px, rgba(0, 255, 0, 0.03) 2px, transparent 2px, transparent 8px);
                pointer-events: none;
                z-index: 0;
            }

            /* Глитч-эффект для атмосферы */
            body::after {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: repeating-linear-gradient(90deg, rgba(0, 255, 0, 0.02) 0px, rgba(0, 255, 0, 0.02) 1px, transparent 1px, transparent 3px);
                pointer-events: none;
                z-index: 0;
            }

        /* Карточка главного меню */
        .menu-container {
            background: rgba(0, 5, 0, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 42px;
            padding: 3rem 2.5rem;
            width: 90%;
            max-width: 550px;
            text-align: center;
            border: 1px solid rgba(0, 255, 0, 0.35);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6), 0 0 18px rgba(0, 255, 0, 0.3), inset 0 1px 0 rgba(0, 255, 0, 0.2);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
            animation: fadeSlideUp 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

            .menu-container:hover {
                border-color: rgba(0, 255, 0, 0.7);
                box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 28px rgba(0, 255, 0, 0.5);
                transform: translateY(-3px);
            }

        /* Логотип / иконка мессенджера */
        .logo-icon {
            font-size: 4rem;
            filter: drop-shadow(0 0 6px #0f0);
            margin-bottom: 0.5rem;
            display: inline-block;
            animation: pulseGlow 2.2s infinite alternate;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #b3ffb3, #00cc44, #00aa33);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(0, 200, 0, 0.4);
            margin-bottom: 0.5rem;
            word-break: keep-all;
        }

        /* Изысканное подчеркивание */
        .title-glow {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #0f0, #0f0, #0f0, transparent);
            margin: 0.6rem auto 1rem auto;
            border-radius: 4px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 400;
            color: #b4ffb4;
            margin-bottom: 2rem;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #0a4d0a;
            background: rgba(0, 20, 0, 0.5);
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            font-family: monospace;
        }

        /* Кнопка — главный акцент */
        .cyber-button {
            background: #030f03;
            border: 1.8px solid #1eff6e;
            color: #b3ffcf;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 1rem 2.2rem;
            margin-top: 1rem;
            border-radius: 60px;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            letter-spacing: 2px;
            transition: 0.25s ease;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.4);
            background-image: linear-gradient(120deg, transparent 30%, rgba(0, 255, 0, 0.15) 50%, transparent 70%);
            background-size: 200% auto;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

            .cyber-button:hover {
                background-color: #0a240a;
                color: #ffffff;
                border-color: #7eff8e;
                box-shadow: 0 0 18px #00ff66, 0 0 8px #00ff44;
                text-shadow: 0 0 5px #00aa33;
                transform: scale(1.02);
                background-position: right center;
            }

            .cyber-button:active {
                transform: scale(0.97);
                transition: 0.05s;
            }

        /* дополнительный декоративный элемент — сканирующая линия */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 255, 0, 0.05) 50%, transparent 100%);
            pointer-events: none;
            z-index: 3;
            animation: scanMove 8s linear infinite;
            border-radius: inherit;
        }

        /* статусная строка в стиле терминала */
        .status-bar {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #0fa80f;
            font-family: monospace;
            background: #05100580;
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            border-left: 3px solid #26ff6e;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #2eff7a;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 6px #00ff55;
            animation: blink 1.2s step-end infinite;
        }

        /* анимации */
        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(35px);
                filter: blur(4px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes pulseGlow {
            0% {
                text-shadow: 0 0 0px #0f0;
                filter: drop-shadow(0 0 0px #00cc44);
            }

            100% {
                text-shadow: 0 0 6px #0f0;
                filter: drop-shadow(0 0 8px #2eff7a);
            }
        }

        @keyframes scanMove {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100%);
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* небольшой респонсив */
        @media (max-width: 550px) {
            .menu-container {
                padding: 2rem 1.2rem;
            }

            h1 {
                font-size: 1.9rem;
            }

            h2 {
                font-size: 1.2rem;
            }

            .cyber-button {
                font-size: 1.2rem;
                padding: 0.8rem 1.6rem;
            }

            .logo-icon {
                font-size: 3rem;
            }
        }

        /* hover-эффект для глитч-текста (опционально) */
        h1:hover {
            animation: glitchText 0.25s infinite;
        }

        @keyframes glitchText {
            0% {
                text-shadow: -2px 0 #0f0, 2px 0 #006400;
            }

            50% {
                text-shadow: 2px 0 #0f0, -2px 0 #006400;
            }

            100% {
                text-shadow: -1px 0 #0f0, 1px 0 #006400;
            }
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <div class="scan-line"></div>
        <div class="logo-icon">
            💚
        </div>
        <h1>Мессенджер Serlen</h1>
        <div class="title-glow"></div>
        <h2>Добро пожаловать!</h2>
        <form method="get" action="/enter">
            <button type="submit" class="cyber-button">
                ⚡ НАЧАТЬ ОБЩЕНИЕ ⚡
            </button>
        </form>
        <div class="status-bar">
            <span class="status-dot"></span> secure connection | matrix protocol v2.4
        </div>
        <div style="margin-top: 1rem; font-size: 0.65rem; color: #2c8c2c;">
            # black_green_messenger
        </div>
    </div>
</body>
</html>
