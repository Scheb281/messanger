<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Matrix Error — Ошибка регистрации</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f0a, #030603);
            font-family: 'Courier New', 'Fira Code', 'Source Code Pro', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Эффект падающих цифр (матричный дождь) */
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
        }

        /* Анимированный фон с линиями кода */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.03) 0px, rgba(0, 255, 0, 0.03) 2px, transparent 2px, transparent 6px);
            pointer-events: none;
            z-index: 0;
        }

        /* Глитч-эффект для заголовков (иногда) */
        @keyframes glitch {
            0% {
                text-shadow: -2px 0 #0f0, 2px 0 #0f0;
                opacity: 0.9;
            }

            20% {
                text-shadow: -2px 0 #0f0, 2px 0 #0f0;
            }

            21% {
                text-shadow: 2px 0 #0f0, -2px 0 #0f0;
            }

            40% {
                text-shadow: 2px 0 #0f0, -2px 0 #0f0;
            }

            41% {
                text-shadow: -1px 0 #0f0, 1px 0 #0f0;
            }

            100% {
                text-shadow: -1px 0 #0f0, 1px 0 #0f0;
            }
        }

        /* Карточка ошибки */
        .error-container {
            position: relative;
            z-index: 10;
            background: rgba(0, 10, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 1.5px solid #0f0;
            border-radius: 28px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3), inset 0 0 12px rgba(0, 255, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 2.2rem 2rem 2.5rem;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
                filter: blur(2px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* Стиль для заголовка h1 (ошибка регистрации) */
        h1 {
            font-size: 2.3rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #1eff1e;
            border-left: 5px solid #0f0;
            padding-left: 20px;
            margin-bottom: 30px;
            font-weight: 600;
            word-break: break-word;
            animation: glitch 3s infinite ease-in-out;
            text-shadow: 0 0 6px #0f0, 0 0 12px #0f0;
        }

        /* Второй заголовок "Причины" */
        h2 {
            font-size: 1.5rem;
            color: #b3ffb3;
            margin: 25px 0 12px 0;
            border-bottom: 1px dashed #2e8b57;
            display: inline-block;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* Стили для элементов-причин (ник, логин, пароль) */
        .error-list {
            list-style: none;
            margin: 10px 0 20px 0;
        }

        .error-item {
            background: rgba(0, 20, 0, 0.7);
            margin: 14px 0;
            padding: 12px 18px;
            border-radius: 14px;
            border-left: 4px solid #0f0;
            font-size: 1.2rem;
            font-weight: bold;
            color: #cfefcf;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            box-shadow: 0 1px 4px rgba(0, 255, 0, 0.2);
        }

            .error-item:hover {
                background: rgba(0, 40, 0, 0.85);
                transform: translateX(6px);
                border-left-width: 6px;
                box-shadow: 0 0 12px rgba(0, 255, 0, 0.4);
            }

        /* Иконка ошибки (символ >_ ) */
        .error-icon {
            font-size: 1.6rem;
            filter: drop-shadow(0 0 4px #0f0);
            font-weight: bold;
            color: #0f0;
        }

        .error-text {
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
        }

        /* Кнопка назад в стиле матрицы */
        .matrix-btn {
            margin-top: 35px;
            text-align: center;
        }

        button {
            background: transparent;
            border: 2px solid #0f0;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
            width: 100%;
            max-width: 260px;
        }

            button:hover {
                background: #0f0;
                color: #030603;
                box-shadow: 0 0 22px #0f0, 0 0 8px #0f0 inset;
                transform: scale(1.02);
                border-color: #9eff9e;
                text-shadow: none;
                font-weight: bold;
            }

            button:active {
                transform: scale(0.97);
            }

        /* Сканер / бегущая линия внизу */
        .scan-line {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #0f0, #0f0, transparent);
            animation: scanMove 3s linear infinite;
            z-index: 20;
            opacity: 0.5;
            pointer-events: none;
        }

        @keyframes scanMove {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        /* Эффект моргания курсора в конце */
        .cursor-blink {
            display: inline-block;
            width: 10px;
            height: 18px;
            background-color: #0f0;
            vertical-align: middle;
            margin-left: 6px;
            box-shadow: 0 0 6px #0f0;
            animation: blink 1.2s step-end infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* Адаптивность для мобильных */
        @media (max-width: 550px) {
            .error-container {
                padding: 1.5rem 1.2rem;
            }

            h1 {
                font-size: 1.6rem;
                padding-left: 12px;
            }

            h2 {
                font-size: 1.2rem;
            }

            .error-item {
                font-size: 1rem;
                padding: 8px 12px;
            }

            button {
                font-size: 1rem;
                padding: 10px 20px;
            }
        }

        /* дополнительная атмосфера: мигающие уголки */
        .corner-glow {
            position: fixed;
            width: 120px;
            height: 120px;
            border: 1px solid rgba(0, 255, 0, 0.4);
            filter: blur(3px);
            pointer-events: none;
            z-index: 1;
        }

        .corner-tl {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner-br {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>
<body>

    <!-- Падающий матричный дождь (Canvas) -->
    <canvas id="matrixCanvas" class="matrix-rain"></canvas>
    <div class="scan-line"></div>
    <div class="corner-glow corner-tl"></div>
    <div class="corner-glow corner-br"></div>

    <div class="error-container">
        <h1>Ошибка регистрации</h1>

        <h2>> Причины отказа</h2>

        <div class="error-list">
            <div class="error-item">
                <span class="error-icon">⛔</span>
                <span class="error-text">✖ НИК УЖЕ ЗАНЯТ</span>
            </div>
            <div class="error-item">
                <span class="error-icon">⚠️</span>
                <span class="error-text">✖ ЛОГИН УЖЕ ЗАНЯТ</span>
            </div>
            <div class="error-item">
                <span class="error-icon">🔒</span>
                <span class="error-text">✖ В ПАРОЛЕ МЕНЕЕ 6 СИМВОЛОВ</span>
            </div>
        </div>

        <!-- Дополнительное предупреждение / кибер-текст -->
        <div style="margin: 15px 0 5px 0; font-size: 0.85rem; color: #5f9e5f; border-top: 1px solid #1a4d1a; padding-top: 15px; text-align: center; letter-spacing: 1px;">
            <span>access denied </span><span class="cursor-blink"></span>
        </div>

        <form method="get" action="/reg" class="matrix-btn">
            <button type="submit">⟳ НАЗАД</button>
        </form>
    </div>
</body>
</html>
