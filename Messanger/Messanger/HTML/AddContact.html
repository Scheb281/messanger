<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AddContact | Матрица</title>
    <style>
        /* Сброс и базовые стили в духе Матрицы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f0a, #030603);
            font-family: 'Courier New', 'Fira Code', 'Cascadia Code', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

            /* Анимированный эффект падающих цифр (как в Матрице) */
            body::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.03) 0px, rgba(0, 255, 0, 0.03) 2px, transparent 2px, transparent 6px);
                pointer-events: none;
                z-index: 0;
                animation: matrixScan 12s linear infinite;
            }

        /* Мерцающие "кадры" как в старом мониторе */
        @keyframes matrixScan {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 20px;
            }
        }

        /* Главная карточка — терминал */
        .terminal-card {
            background: rgba(0, 10, 0, 0.85);
            backdrop-filter: blur(3px);
            border: 1.5px solid #1eff6e;
            border-radius: 32px;
            padding: 2rem 2.5rem;
            width: 90%;
            max-width: 520px;
            box-shadow: 0 0 25px rgba(30, 255, 110, 0.3), inset 0 0 12px rgba(30, 255, 110, 0.1);
            transition: all 0.2s ease;
            z-index: 2;
            position: relative;
        }

        /* Заголовок с мигающим курсором */
        h1 {
            color: #2eff7a;
            font-size: 1.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: 600;
            text-shadow: 0 0 8px #1eff6e;
            border-right: 3px solid #2eff7a;
            white-space: nowrap;
            overflow: hidden;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding-right: 12px;
            animation: blinkCursor 0.9s step-end infinite, typingGlow 2s ease-out;
        }

        @keyframes blinkCursor {
            0%, 100% {
                border-color: #2eff7a;
            }

            50% {
                border-color: transparent;
            }
        }

        @keyframes typingGlow {
            0% {
                opacity: 0;
                letter-spacing: 8px;
                text-shadow: 0 0 0px;
            }

            30% {
                opacity: 1;
                letter-spacing: 3px;
                text-shadow: 0 0 6px #2eff7a;
            }
        }

        /* Стили для формы и инпутов */
        .add-form {
            margin: 1.8rem 0 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 28px;
        }

        label {
            color: #9effa5;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: bold;
            margin-left: 6px;
        }

        /* Поле ввода — кибер-стиль */
        .matrix-input {
            background: #051005;
            border: 1px solid #2c9e4c;
            padding: 14px 18px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            color: #b3ffb3;
            border-radius: 48px;
            outline: none;
            transition: all 0.25s;
            width: 100%;
            box-shadow: inset 0 0 6px rgba(0, 30, 0, 0.8);
        }

            .matrix-input:focus {
                border-color: #3eff9e;
                box-shadow: 0 0 14px #3eff9e, inset 0 0 4px #1eff6e;
                background: #071a07;
                color: #d4ffd4;
            }

            .matrix-input::placeholder {
                color: #397a3e;
                font-style: italic;
                letter-spacing: 0.5px;
            }

        /* Кнопки с хакерским отливом */
        .btn {
            background: rgba(0, 20, 0, 0.85);
            border: 1.2px solid #26d96c;
            padding: 12px 18px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: #68ff9b;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
            margin-top: 6px;
        }

        .btn-primary {
            background: #0f2f0f;
            box-shadow: 0 0 6px #31d670;
            color: #d2ffc9;
        }

            .btn-primary:hover {
                background: #1d551d;
                box-shadow: 0 0 14px #4eff92;
                border-color: #9effb2;
                transform: scale(1.01);
                color: #ffffff;
                text-shadow: 0 0 3px #1eff6e;
            }

        .btn-secondary {
            background: #031003;
            border-color: #1e7a3c;
            color: #6ab577;
            margin-top: 12px;
        }

            .btn-secondary:hover {
                background: #0b2e0b;
                border-color: #6effa3;
                box-shadow: 0 0 12px #29cc66;
                color: #baffcf;
            }

        /* Строка кода / статус (эффект терминала) */
        .code-status {
            margin-top: 28px;
            text-align: center;
            font-size: 0.7rem;
            color: #41b16c;
            border-top: 1px dashed #2b8246;
            padding-top: 18px;
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

            .code-status span {
                background: #071007;
                padding: 6px 12px;
                border-radius: 40px;
                font-family: monospace;
                letter-spacing: 0.5px;
                font-size: 0.75rem;
            }

        .blink-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #2eff7a;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 6px #6eff8e;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Эффект "ряби" при наведении на карточку */
        .terminal-card:hover {
            box-shadow: 0 0 32px rgba(50, 255, 100, 0.5);
            border-color: #6eff8e;
        }

        /* адаптивность */
        @media (max-width: 500px) {
            .terminal-card {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.4rem;
                white-space: normal;
                border-right: none;
                animation: none;
                text-align: center;
            }

            .btn {
                font-size: 0.9rem;
            }
        }

        /* Дополнительный «цифровой дождь» из псевдоэлемента */
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.2;
        }
    </style>
</head>
<body>

    <div class="terminal-card">
        <h1>> AddContact.exe</h1>

        <form method="post" action="/AddContact" class="add-form">
            <div class="input-group">
                <label>> USER_NICKNAME:</label>
                <input type="text" class="matrix-input" name="nik" placeholder="agent_smith || neo_22" autocomplete="off" required>
            </div>
            <button type="submit" class="btn btn-primary">⟣ ДОБАВИТЬ КОНТАКТ ⟢</button>
        </form>

        <form method="get" action="/chats">
            <button type="submit" class="btn btn-secondary">⌂ НАЗАД / ОТМЕНА</button>
        </form>

        <div class="code-status">
            <span><span class="blink-dot"></span> MATRIX_NODE_ACTIVE</span>
            <span>⚡ ENCRYPT: AES-256</span>
            <span>📡 SECURE_CHAT v2.0</span>
        </div>
    </div>

    <!-- Лёгкий эффект "падающих символов" (дополнительная атмосфера) -->
    <div class="matrix-rain" id="matrixRain"></div>
</body>
</html>
