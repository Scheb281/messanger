<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrix | Контакт добавлен</title>
    <style>
        /* Глобальные стили — хакерская эстетика */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #010901, #000200);
            font-family: 'Courier New', 'Fira Code', 'Cascadia Code', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

            /* Эффект старых ЭЛТ-мониторов — сканирующие полосы */
            body::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.03) 0px, rgba(0, 255, 0, 0.03) 2px, transparent 2px, transparent 8px);
                pointer-events: none;
                z-index: 1;
                animation: scanMove 10s linear infinite;
            }

        @keyframes scanMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 40px;
            }
        }

        /* Виньетка по краям */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 130px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 1;
        }

        /* Главная карточка успеха — светящийся терминал */
        .success-terminal {
            background: rgba(5, 15, 5, 0.92);
            backdrop-filter: blur(5px);
            border: 2px solid #2eff7a;
            border-radius: 36px;
            padding: 2.5rem 2.2rem;
            width: 90%;
            max-width: 540px;
            box-shadow: 0 0 40px rgba(46, 255, 122, 0.5), inset 0 0 15px rgba(46, 255, 122, 0.2);
            transition: all 0.3s ease;
            z-index: 10;
            position: relative;
            animation: terminalRise 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes terminalRise {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(15px);
                filter: blur(2px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        .success-terminal:hover {
            box-shadow: 0 0 55px rgba(46, 255, 122, 0.7);
            border-color: #6effa0;
        }

        /* Заголовок с мигающим курсором */
        .success-title {
            text-align: center;
            margin-bottom: 1.8rem;
        }

            .success-title h1 {
                color: #3eff8a;
                font-size: 2rem;
                letter-spacing: 4px;
                text-transform: uppercase;
                font-weight: 700;
                text-shadow: 0 0 12px #1eff6e, 0 0 20px #2eff7a;
                background: rgba(0, 20, 0, 0.5);
                display: inline-block;
                padding: 0.2rem 1.5rem 0.4rem;
                border-bottom: 3px solid #2eff7a;
                font-family: 'Courier New', monospace;
                position: relative;
            }

        /* Анимированная иконка галочки и ASCII-арт */
        .success-icon {
            text-align: center;
            font-size: 4.2rem;
            margin: 1rem 0 0.5rem;
            filter: drop-shadow(0 0 10px #2eff7a);
            animation: successPulse 1.4s infinite ease-in-out;
        }

        @keyframes successPulse {
            0% {
                opacity: 0.7;
                text-shadow: 0 0 0px #2eff7a;
                transform: scale(0.98);
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 18px #6effaa;
                transform: scale(1.03);
            }

            100% {
                opacity: 0.7;
                text-shadow: 0 0 0px #2eff7a;
                transform: scale(0.98);
            }
        }

        /* Блок-лог с информацией об операции */
        .info-log {
            background: #071207;
            border-left: 6px solid #2eff7a;
            padding: 1.2rem 1.3rem;
            margin: 1.8rem 0;
            border-radius: 20px;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.7), 0 4px 12px rgba(46, 255, 100, 0.2);
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #aaffbb;
            border-bottom: 1px dashed #2c8846;
            padding-bottom: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .green-blink {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #2eff7a;
            border-radius: 50%;
            box-shadow: 0 0 8px #4eff8c;
            animation: greenBlinkFast 0.8s infinite;
        }

        @keyframes greenBlinkFast {
            0% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .success-message {
            font-size: 1.2rem;
            font-weight: bold;
            color: #c6ffc1;
            line-height: 1.5;
            word-break: break-word;
        }

            .success-message span {
                background: #0a2a0f;
                padding: 4px 12px;
                border-radius: 28px;
                color: #9effb2;
                font-family: monospace;
                border: 1px solid #2eff7a;
            }

        .operation-details {
            margin-top: 15px;
            font-size: 0.78rem;
            color: #6eb47b;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            border-top: 1px dashed #297a41;
            padding-top: 12px;
        }

        /* Кнопка "К чатам" в стиле матрицы */
        .btn-matrix-success {
            background: rgba(10, 25, 10, 0.95);
            border: 1.8px solid #2eff7a;
            padding: 14px 22px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.15rem;
            letter-spacing: 2.5px;
            color: #ccffcc;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s;
            width: 100%;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

            .btn-matrix-success:hover {
                background: #1b3a1b;
                border-color: #6effa0;
                box-shadow: 0 0 24px #2eff7a;
                color: #ffffff;
                text-shadow: 0 0 6px #2eff7a;
                transform: scale(1.01);
            }

        /* Нижний статус бар — матричные метрики */
        .footer-matrix {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.7rem;
            color: #5a9c6e;
            border-top: 1px solid #2a6e3c;
            padding-top: 1.2rem;
        }

        .status-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0c170c;
            padding: 5px 12px;
            border-radius: 40px;
        }

        .led-green {
            display: inline-block;
            width: 9px;
            height: 9px;
            background-color: #2eff7a;
            border-radius: 50%;
            box-shadow: 0 0 8px #44ff88;
            animation: ledPulse 1s infinite;
        }

        @keyframes ledPulse {
            0% {
                opacity: 0.5;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Эффект "загрузки" и глитч для декора */
        @keyframes textGlitchSuccess {
            0% {
                text-shadow: -1px 0 #2eff7a, 1px 0 #00ffaa;
            }

            50% {
                text-shadow: 1px 0 #2eff7a, -1px 0 #00ffaa;
            }

            100% {
                text-shadow: -1px 0 #2eff7a, 1px 0 #00ffaa;
            }
        }

        .glitch-success {
            animation: textGlitchSuccess 0.4s infinite;
        }

        /* Адаптивность под мобильные */
        @media (max-width: 580px) {
            .success-terminal {
                padding: 1.6rem;
            }

            .success-title h1 {
                font-size: 1.4rem;
                letter-spacing: 2px;
            }

            .success-icon {
                font-size: 2.8rem;
            }

            .success-message {
                font-size: 0.95rem;
            }

            .btn-matrix-success {
                font-size: 0.9rem;
                padding: 10px 14px;
            }
        }

        /* Анимированный фон с падающими кодами */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.22;
        }
    </style>
</head>
<body>

    <div class="success-terminal">
        <div class="success-title">
            <h1>✓ CONTACT_ADDED ✓</h1>
        </div>

        <div class="success-icon">
            [✔] [+] [✔]
        </div>

        <div class="info-log">
            <div class="status-line">
                <span class="green-blink"></span> STATUS: <span style="color:#8effa5; font-weight:bold;">SUCCESS</span>
                <span style="margin-left:auto;">CODE: 0x200</span>
            </div>
            <div class="success-message">
                ✦ <span>«Контакт успешно добавлен»</span> ✦<br>
                ➜ Запись внесена в матрицу<br>
                ➜ Канал связи активирован
            </div>
            <div class="operation-details">
                <span>🔗 ID: #NEO_7623</span>
                <span>⚡ ENCRYPT: ACTIVE</span>
                <span>📡 SYNC: OK</span>
            </div>
        </div>

        <!-- Кнопка перехода к чатам -->
        <form method="get" action="/chats">
            <button type="submit" class="btn-matrix-success">
                <span>⌨️</span> К ЧАТАМ / ENTER <span>⏎</span>
            </button>
        </form>

        <div class="footer-matrix">
            <div class="status-chip">
                <span class="led-green"></span> MATRIX_NODE: SYNCED
            </div>
            <div class="status-chip">
                🟢 CONTACT_DB: UPDATED
            </div>
            <div class="status-chip">
                🔐 SECURE_PROTOCOL v3.1
            </div>
        </div>
    </div>
</body>
</html>
