<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Матрица | Аккаунт активирован</title>
    <style>
        /* ---------- МАТРИЦА: АККАУНТ СОЗДАН (ТОРЖЕСТВЕННЫЙ СТИЛЬ, ЧИСТЫЙ CSS) ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 40% 50%, #021102, #000300);
            font-family: 'Courier New', 'Fira Code', 'Source Code Pro', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

            /* ----- МАТРИЧНЫЙ ФОН (код + анимированный дождь) ----- */
            body::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: repeating-linear-gradient(0deg, rgba(0, 30, 0, 0.25) 0px, rgba(0, 60, 0, 0.25) 2px, transparent 2px, transparent 9px), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" opacity="0.12"><text x="12" y="22" fill="%2333ff55" font-size="9" font-family="monospace">01100001</text><text x="70" y="48" fill="%2322ee44" font-size="8">01100011</text><text x="130" y="78" fill="%2333ff66" font-size="10">01100011</text><text x="40" y="92" fill="%2322ff55" font-size="8">01100101</text><text x="150" y="28" fill="%2333dd55" font-size="9">01110011</text><text x="25" y="65" fill="%2322cc44" font-size="8">01110011</text><text x="100" y="38" fill="%2333ff44" font-size="9">00100000</text></svg>');
                background-repeat: repeat;
                background-size: 85px 85px, 160px 140px;
                pointer-events: none;
                z-index: 0;
                animation: matrixBgScroll 36s linear infinite;
            }

        @keyframes matrixBgScroll {
            0% {
                background-position: 0 0, 0 0;
            }

            100% {
                background-position: 130px 130px, 80px 160px;
            }
        }

        /* Падающие символы (матричный дождь, чисто CSS) */
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

            .matrix-rain::before,
            .matrix-rain::after {
                position: absolute;
                font-family: monospace;
                font-weight: bold;
                white-space: nowrap;
                color: rgba(70, 255, 110, 0.2);
                text-shadow: 0 0 5px #3eff7a;
                animation: fallMatrix 13s linear infinite;
            }

            .matrix-rain::before {
                content: "01 10 11 00 10 01 10 11 00 01 10 01 10 11 00 10 01 10 11 01 00 10 01 10 11 00";
                top: -25%;
                left: 5%;
                font-size: 22px;
                letter-spacing: 30px;
                animation-duration: 11s;
                animation-delay: 0s;
            }

            .matrix-rain::after {
                content: "1100 0110 1010 1001 0011 1101 0110 1011 0010 1110 0101 1001 0110 1101";
                top: -35%;
                left: 55%;
                font-size: 26px;
                letter-spacing: 38px;
                animation-duration: 15s;
                animation-delay: 2s;
                color: rgba(90, 255, 130, 0.18);
            }

        @keyframes fallMatrix {
            0% {
                transform: translateY(-20%) translateX(0px);
                opacity: 0;
            }

            12% {
                opacity: 0.55;
            }

            88% {
                opacity: 0.35;
            }

            100% {
                transform: translateY(130vh) translateX(35px);
                opacity: 0;
            }
        }

        /* Дополнительные колонны с символами (разнообразие) */
        .code-columns {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

            .code-columns div {
                position: absolute;
                font-family: monospace;
                font-weight: bold;
                white-space: pre;
                color: rgba(55, 220, 80, 0.22);
                animation: columnDrop linear infinite;
            }

        /* Разные колонки */
        .col1 {
            left: 7%;
            font-size: 19px;
            animation-duration: 11s;
            animation-delay: 0.8s;
            top: -15%;
        }

        .col2 {
            left: 19%;
            font-size: 23px;
            animation-duration: 13s;
            animation-delay: 2.2s;
            top: -25%;
        }

        .col3 {
            left: 31%;
            font-size: 20px;
            animation-duration: 10s;
            animation-delay: 1.5s;
            top: -8%;
        }

        .col4 {
            left: 44%;
            font-size: 25px;
            animation-duration: 14s;
            animation-delay: 3s;
            top: -20%;
        }

        .col5 {
            left: 56%;
            font-size: 18px;
            animation-duration: 12s;
            animation-delay: 0.3s;
            top: -30%;
        }

        .col6 {
            left: 68%;
            font-size: 22px;
            animation-duration: 9.5s;
            animation-delay: 2.8s;
            top: -12%;
        }

        .col7 {
            left: 80%;
            font-size: 20px;
            animation-duration: 15s;
            animation-delay: 1.1s;
            top: -18%;
        }

        .col8 {
            left: 92%;
            font-size: 24px;
            animation-duration: 11.8s;
            animation-delay: 3.5s;
            top: -5%;
        }

        @keyframes columnDrop {
            0% {
                transform: translateY(-30%);
                opacity: 0;
            }

            15% {
                opacity: 0.5;
            }

            85% {
                opacity: 0.3;
            }

            100% {
                transform: translateY(140vh);
                opacity: 0;
            }
        }

        /* Бинарные наборы для колонок */
        .col1::before {
            content: "1010 0110 1100 0011";
            display: block;
        }

        .col2::before {
            content: "1101 0010 1011 0111";
            display: block;
        }

        .col3::before {
            content: "0110 1001 1110 0100";
            display: block;
        }

        .col4::before {
            content: "1001 1100 0010 1101";
            display: block;
        }

        .col5::before {
            content: "0101 1010 0110 1001";
            display: block;
        }

        .col6::before {
            content: "1110 0001 1011 0101";
            display: block;
        }

        .col7::before {
            content: "0011 1100 1001 0110";
            display: block;
        }

        .col8::before {
            content: "0111 1000 0101 1011";
            display: block;
        }

        /* ---------- ГЛАВНЫЙ КОНТЕЙНЕР УСПЕХА (СТИЛЬ ТЕРМИНАЛА) ---------- */
        .success-container {
            position: relative;
            z-index: 25;
            background: rgba(0, 8, 0, 0.78);
            backdrop-filter: blur(12px);
            border: 2.5px solid #3eff8a;
            border-radius: 56px;
            padding: 2.8rem 2.2rem;
            width: 90%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 0 45px rgba(0, 255, 80, 0.5), inset 0 0 20px rgba(90, 255, 120, 0.25);
            transition: all 0.3s ease;
            animation: successGlow 2.8s infinite alternate;
        }

        @keyframes successGlow {
            0% {
                border-color: #3eff7a;
                box-shadow: 0 0 30px rgba(60, 255, 100, 0.4);
            }

            100% {
                border-color: #ccffaa;
                box-shadow: 0 0 65px rgba(80, 255, 120, 0.8), inset 0 0 18px #9effaa;
            }
        }

        /* Заголовок "Аккаунт создан!" с глитч-эффектом и свечением */
        h1 {
            font-size: 2.4rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #ccffcc;
            text-shadow: 0 0 12px #00ff66, 0 0 6px #4eff8e;
            letter-spacing: 5px;
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
            width: 100%;
            animation: titleSuccessPulse 2s infinite alternate;
        }

        @keyframes titleSuccessPulse {
            0% {
                text-shadow: 0 0 6px #00ff55, 0 0 2px #2eff7a;
                letter-spacing: 4px;
            }

            100% {
                text-shadow: 0 0 22px #5effaa, 0 0 8px #aaffaa;
                letter-spacing: 6px;
            }
        }

        /* Глитч-слои для заголовка */
        h1::before,
        h1::after {
            content: "АККАУНТ СОЗДАН!";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.5;
            pointer-events: none;
        }

        h1::before {
            color: #ff66aa;
            z-index: -1;
            text-shadow: 2px 0 #ff4488;
            transform: translate(-1.2px, 0);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitchSuccess1 2.5s infinite steps(1);
        }

        h1::after {
            color: #88ffaa;
            z-index: -2;
            text-shadow: -2px 0 #44ff88;
            transform: translate(1.2px, 0);
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
            animation: glitchSuccess2 2.2s infinite steps(1);
        }

        @keyframes glitchSuccess1 {
            0%, 100% {
                transform: translate(-1px, 0);
                opacity: 0.4;
            }

            22% {
                transform: translate(1.2px, 0.5px);
                opacity: 0.7;
            }

            45% {
                transform: translate(-1.5px, -0.3px);
                opacity: 0.3;
            }

            70% {
                transform: translate(1.3px, 0.2px);
                opacity: 0.6;
            }
        }

        @keyframes glitchSuccess2 {
            0%, 100% {
                transform: translate(1px, 0);
                opacity: 0.5;
            }

            30% {
                transform: translate(-1.3px, -0.4px);
                opacity: 0.75;
            }

            55% {
                transform: translate(1.7px, 0.3px);
                opacity: 0.35;
            }

            85% {
                transform: translate(-0.9px, -0.2px);
                opacity: 0.7;
            }
        }

        /* Иконка / символ подтверждения (матричный "галочка") */
        .success-icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            color: #6eff9e;
            text-shadow: 0 0 18px #2eff7a;
            letter-spacing: 8px;
            animation: iconBlink 1.6s infinite alternate;
        }

        @keyframes iconBlink {
            0% {
                text-shadow: 0 0 4px #2eff6e;
                opacity: 0.85;
                transform: scale(1);
            }

            100% {
                text-shadow: 0 0 28px #aaffaa;
                opacity: 1;
                transform: scale(1.02);
            }
        }

        /* Текст поздравления (матричный стиль) */
        .congrats-message {
            background: rgba(0, 20, 0, 0.55);
            border-left: 4px solid #4eff8e;
            padding: 14px 18px;
            margin: 25px 0 20px 0;
            font-size: 1rem;
            color: #bcffbc;
            text-align: left;
            font-family: monospace;
            border-radius: 16px;
            backdrop-filter: blur(3px);
            letter-spacing: 0.5px;
        }

            .congrats-message span {
                color: #aaffaa;
                font-weight: bold;
                text-shadow: 0 0 3px #2eff6e;
            }

        /* Кнопка "К чатам" — главное действие, усиленный матричный стиль */
        .btn-chat {
            background: linear-gradient(95deg, rgba(20, 70, 20, 0.7), rgba(0, 35, 0, 0.8));
            border: 2px solid #4eff8a;
            color: #e6ffe6;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.3rem;
            padding: 14px 32px;
            border-radius: 70px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            width: 100%;
            max-width: 280px;
            letter-spacing: 5px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(70, 255, 100, 0.5);
            margin: 20px auto 0 auto;
            display: inline-block;
        }

            .btn-chat:hover {
                background: #2eff5e33;
                border-color: #eeffcc;
                color: #ffffff;
                text-shadow: 0 0 12px #0f0;
                box-shadow: 0 0 38px #6eff9e;
                transform: scale(1.03);
                letter-spacing: 7px;
            }

            .btn-chat:active {
                transform: scale(0.97);
            }

        /* Декоративный разделитель (матричная линия) */
        .matrix-divider {
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4eff8a, #bbffaa, #4eff8a, transparent);
            margin: 20px auto 15px auto;
            opacity: 0.6;
            border-radius: 2px;
        }

        /* Эффект сканирующей линии (мониторный стиль) */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #6eff9e, #ccffaa, #6eff9e, transparent);
            box-shadow: 0 0 22px #4eff8e;
            z-index: 35;
            animation: scanVertical 6s ease-in-out infinite;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes scanVertical {
            0% {
                top: -3%;
                opacity: 0.4;
            }

            50% {
                top: 97%;
                opacity: 1;
            }

            100% {
                top: -3%;
                opacity: 0.4;
            }
        }

        /* Статус-бар внизу (матричный дайджест) */
        .status-bar {
            position: fixed;
            bottom: 18px;
            left: 20px;
            font-size: 11px;
            background: rgba(0, 15, 0, 0.7);
            backdrop-filter: blur(6px);
            padding: 6px 16px;
            border-radius: 32px;
            font-family: monospace;
            color: #8affaa;
            border-left: 3px solid #4eff8e;
            letter-spacing: 1.2px;
            z-index: 30;
            animation: statusPulse 2s infinite alternate;
        }

        @keyframes statusPulse {
            0% {
                opacity: 0.55;
                text-shadow: none;
                border-left-color: #3eff7a;
            }

            100% {
                opacity: 1;
                text-shadow: 0 0 4px #6eff9e;
                border-left-color: #ccffaa;
            }
        }

        /* Эффект "кинескопа" (лёгкая рябь) */
        .crt-flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 200, 0, 0.02) 0px, rgba(0, 0, 0, 0.03) 1px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 40;
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 620px) {
            .success-container {
                padding: 1.8rem 1.2rem;
                max-width: 92%;
            }

            h1 {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }

            .success-icon {
                font-size: 2.8rem;
            }

            .btn-chat {
                font-size: 1rem;
                padding: 10px 20px;
                max-width: 230px;
                letter-spacing: 3px;
            }

            .congrats-message {
                font-size: 0.85rem;
                padding: 10px 14px;
            }

            .status-bar {
                font-size: 8px;
                bottom: 12px;
                left: 12px;
            }

            .col1, .col2, .col3, .col4, .col5, .col6, .col7, .col8 {
                font-size: 14px !important;
            }
        }

        /* Доп. стили для форм */
        form {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        button {
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Анимация "цифровой дождь" для контейнера при наведении — лёгкое усиление */
        .success-container:hover {
            transition: 0.2s;
        }
    </style>
</head>
<body>

    <!-- Матричный дождь (чистый CSS) -->
    <div class="matrix-rain"></div>
    <div class="code-columns">
        <div class="col1"></div>
        <div class="col2"></div>
        <div class="col3"></div>
        <div class="col4"></div>
        <div class="col5"></div>
        <div class="col6"></div>
        <div class="col7"></div>
        <div class="col8"></div>
    </div>

    <div class="scan-line"></div>
    <div class="crt-flicker"></div>

    <div class="status-bar">
        [ СИСТЕМА МАТРИЦЫ ] :: АККАУНТ УСПЕШНО ЗАРЕГИСТРИРОВАН
    </div>

    <div class="success-container">
        <div class="success-icon">✓ [ OK ] ✓</div>
        <h1>Аккаунт создан!</h1>

        <div class="congrats-message">
            &gt; <span>ДОСТУП ПРЕДОСТАВЛЕН</span><br>
            &gt; Ваш профиль интегрирован в нейро-сеть.<br>
            &gt; Добро пожаловать в Матрицу, Избранный.
        </div>

        <div class="matrix-divider"></div>

        <form method="get" action="/chats">
            <button type="submit" class="btn-chat">⟣ К ЧАТАМ ⟢</button>
        </form>
    </div>

</body>
</html>
